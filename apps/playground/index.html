<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virgo Terminal Playground</title>
    <style>
      html { color-scheme: dark; }
      body { box-sizing: border-box; height: 100dvh; margin: 0; padding: 16px; background: #000; }
      #root { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; gap: 12px; }
      main { min-width: 0; }
      nav { display: flex; gap: 8px; }
      button[aria-pressed="true"] { border-color: currentColor; }
      .terminal { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
